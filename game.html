<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wild Animals Adventure</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;font-family:system-ui;background:#9cc9e1;color:white}canvas{display:block}#hud{position:fixed;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}#title{position:absolute;top:12px;left:12px;font-size:clamp(18px,3vw,28px);font-weight:900}#stats{position:absolute;top:50px;left:12px;background:#071a18cc;padding:8px 12px;border-radius:10px;font-size:13px}#help{position:absolute;top:12px;right:12px;background:#071a18cc;padding:8px;border-radius:10px;font-size:12px;max-width:190px}#controls{position:fixed;bottom:12px;left:12px;right:12px;display:flex;justify-content:space-between;align-items:end;pointer-events:none}#pad,#actions{pointer-events:auto}#pad{display:grid;grid-template-columns:50px 50px 50px;grid-template-rows:48px 48px;gap:4px}button{background:#071a18d9;color:white;border:1px solid #ffffff88;border-radius:12px;font-weight:800;touch-action:none;min-width:48px;min-height:46px}#up{grid-column:2}#left{grid-column:1;grid-row:2}#down{grid-column:2;grid-row:2}#right{grid-column:3;grid-row:2}#actions{display:flex;gap:6px}#actions button{padding:8px;font-size:12px}#msg{position:fixed;left:50%;top:45%;transform:translate(-50%,-50%);background:#071a18ee;border:1px solid #e8c45c;border-radius:12px;padding:14px;display:none;text-align:center}
</style></head><body><div id="hud"><div id="title">🐺 WILD ANIMALS ADVENTURE</div><div id="stats">Explore the valley<br>Nearby animals: <b>7</b><br>Move: WASD / arrow keys</div><div id="help">Find deer and lions! Explore the hills, rocks and forest.</div></div><div id="controls"><div id="pad"><button id="up">▲</button><button id="left">◀</button><button id="down">▼</button><button id="right">▶</button></div><div id="actions"><button id="jump">JUMP</button><button id="howl">HOWL</button></div></div><div id="msg"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script><script>
(()=>{if(!window.THREE){let m=document.getElementById('msg');m.style.display='block';m.textContent='3D engine could not load. Check internet and refresh.';return}
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9cc9e1);scene.fog=new THREE.Fog(0x9cc9e1,45,145);
const camera=new THREE.PerspectiveCamera(65,innerWidth/innerHeight,.1,300);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.6));renderer.shadowMap.enabled=true;document.body.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xe5f5ff,0x4d5734,2));let sun=new THREE.DirectionalLight(0xffe9be,2.6);sun.position.set(-20,35,15);sun.castShadow=true;scene.add(sun);
const material=c=>new THREE.MeshStandardMaterial({color:c,roughness:.95}),green=material(0x688e40),lightgreen=material(0x83a74c),bark=material(0x59402e),leaf=material(0x2e633b),leaf2=material(0x427a42),rockmat=material(0x777c79),dark=material(0x383d38),blue=material(0x428fae);
let ground=new THREE.Mesh(new THREE.PlaneGeometry(220,220,40,40),green);ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;let pos=ground.geometry.attributes.position;for(let i=0;i<pos.count;i++){let x=pos.getX(i),z=pos.getY(i);pos.setZ(i,Math.sin(x*.07)*.7+Math.cos(z*.08)*.8)}ground.geometry.computeVertexNormals();scene.add(ground);
function put(mesh,x,y,z,s=1){mesh.position.set(x,y,z);mesh.scale.setScalar(s);mesh.castShadow=true;mesh.receiveShadow=true;scene.add(mesh);return mesh}
function tree(x,z,s){put(new THREE.Mesh(new THREE.CylinderGeometry(.16*s,.28*s,2*s,7),bark),x,s,z);for(let i=0;i<3;i++)put(new THREE.Mesh(new THREE.ConeGeometry((1.1-i*.2)*s,1.7*s,7),i%2?leaf:leaf2),x,(1.8+i*.65)*s,z)}
function rock(x,z,s){let r=put(new THREE.Mesh(new THREE.DodecahedronGeometry(1,0),Math.random()>.5?rockmat:dark),x,.35*s,z,s);r.scale.y*=.65;r.rotation.set(Math.random(),Math.random(),Math.random())}
for(let i=0;i<16;i++)put(new THREE.Mesh(new THREE.SphereGeometry(1,12,8),lightgreen),(i%4-2)*28,-5-Math.floor(i/4)*25,-.8,12+Math.random()*5).scale.y=.45;
for(let i=0;i<90;i++){let x=(Math.random()-.5)*150,z=(Math.random()-.5)*150;if(Math.abs(x)<8&&Math.abs(z)<12)continue;if(Math.random()<.6)tree(x,z,.7+Math.random()*.6);else rock(x,z,.5+Math.random()*1.2)}
for(let i=0;i<350;i++){let x=(Math.random()-.5)*170,z=(Math.random()-.5)*170;let blade=new THREE.Mesh(new THREE.ConeGeometry(.07,.4,4),lightgreen);blade.position.set(x,.2,z);scene.add(blade)}
let creek=new THREE.Mesh(new THREE.PlaneGeometry(7,100),blue);creek.rotation.x=-Math.PI/2;creek.position.set(19,.03,-8);scene.add(creek);
function makeAnimal(color,type){let g=new THREE.Group(),fur=material(color),black=material(0x282923),eye=material(0x111111);function ball(m,x,y,z,sx,sy,sz){let a=new THREE.Mesh(new THREE.SphereGeometry(1,12,9),m);a.position.set(x,y,z);a.scale.set(sx,sy,sz);a.castShadow=true;g.add(a)}
ball(fur,0,.85,0,.65,.4,.95);ball(fur,0,1.08,-.78,.43,.42,.42);ball(fur,0,1,-1.12,.28,.2,.34);ball(black,0,.95,-1.39,.15,.1,.12);for(let side of [-1,1]){let ear=new THREE.Mesh(new THREE.ConeGeometry(.13,.32,5),fur);ear.position.set(side*.25,1.48,-.8);g.add(ear);ball(eye,side*.18,1.18,-1.02,.04,.05,.04);for(let z of [-.48,.48]){let leg=new THREE.Mesh(new THREE.CylinderGeometry(.08,.12,.55,7),fur);leg.position.set(side*.4,.35,z);g.add(leg)}}
ball(fur,0,1.05,1,.13,.13,.4);
if(type==='lion'){let mane=new THREE.Mesh(new THREE.SphereGeometry(.5,12,9),material(0x85501f));mane.position.set(0,1.08,-.68);g.add(mane)}
if(type==='deer'){for(let s of [-1,1]){let horn=new THREE.Mesh(new THREE.CylinderGeometry(.025,.055,.48,5),material(0xd8c69b));horn.position.set(s*.22,1.62,-.78);horn.rotation.z=s*.3;g.add(horn)}}
scene.add(g);return g}
let wolf=makeAnimal(0x777c7a,'wolf');wolf.position.set(0,0,0);let animals=[];
for(let i=0;i<4;i++){let a=makeAnimal(0xb4a16d,'deer');a.scale.setScalar(.75);a.position.set(-12+i*7,0,-16-i*2);animals.push({a,x:a.position.x,z:a.position.z,p:Math.random()*6})}
for(let i=0;i<3;i++){let a=makeAnimal(0xc68b39,'lion');a.scale.setScalar(1.05);a.position.set(23+i*5,0,-22-i*5);animals.push({a,x:a.position.x,z:a.position.z,p:Math.random()*6})}
let keys={};addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function bind(id,k){let b=document.getElementById(id);b.onpointerdown=e=>{e.preventDefault();keys[k]=true};['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,e=>{e.preventDefault();keys[k]=false}))}bind('up','w');bind('down','s');bind('left','a');bind('right','d');
let vy=0;document.getElementById('jump').onpointerdown=()=>{if(wolf.position.y<.05)vy=7};document.getElementById('howl').onpointerdown=()=>{let m=document.getElementById('msg');m.textContent='🐺 Awooooo! Your howl echoes through the valley!';m.style.display='block';setTimeout(()=>m.style.display='none',1800)};
let clock=new THREE.Clock();function frame(){requestAnimationFrame(frame);let dt=Math.min(clock.getDelta(),.04),f=(keys.w||keys.arrowup?1:0)-(keys.s||keys.arrowdown?1:0),s=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(f||s){let l=Math.hypot(f,s);f/=l;s/=l;wolf.position.x+=s*8*dt;wolf.position.z-=f*8*dt;wolf.rotation.y=Math.atan2(s,-f)}wolf.position.x=THREE.MathUtils.clamp(wolf.position.x,-95,95);wolf.position.z=THREE.MathUtils.clamp(wolf.position.z,-95,95);vy-=18*dt;wolf.position.y=Math.max(0,wolf.position.y+vy*dt);if(!wolf.position.y)vy=0;animals.forEach(c=>{c.p+=dt*.5;c.a.position.x=c.x+Math.sin(c.p)*1.5;c.a.position.z=c.z+Math.cos(c.p)*1.2;c.a.rotation.y=Math.sin(c.p)*.2});camera.position.lerp(new THREE.Vector3(wolf.position.x,wolf.position.y+6,wolf.position.z+11),.09);camera.lookAt(wolf.position.x,wolf.position.y+1,wolf.position.z-2);renderer.render(scene,camera)}frame();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})})();
</script></body></html>
