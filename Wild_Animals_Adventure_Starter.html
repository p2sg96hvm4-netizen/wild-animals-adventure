<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>Wild Animals Adventure — Starter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#14251c;color:#fff;font-family:system-ui,-apple-system,sans-serif;overflow:hidden}#game{position:relative;width:100vw;height:100dvh;min-height:500px;background:linear-gradient(#87b8a1 0%,#4b8a5c 45%,#27583b 100%);overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}.top{position:absolute;left:12px;right:12px;top:12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}.pill,.panel{background:#11251fe8;border:1px solid #ffffff35;border-radius:14px;padding:9px 12px;box-shadow:0 4px 15px #0003}.pill{font-weight:800;font-size:14px}.panel{position:absolute;top:65px;left:12px;width:min(245px,58vw);font-size:13px}.panel h3{margin:0 0 5px;font-size:15px}.bar{height:7px;background:#ffffff2b;border-radius:8px;overflow:hidden;margin:6px 0}.bar span{display:block;height:100%;background:#f3c84b;width:35%}.right{position:absolute;right:12px;top:65px;display:flex;flex-direction:column;gap:8px}.btn{border:1px solid #ffffff40;background:#18382beF;color:white;border-radius:12px;padding:10px 12px;font-weight:750;font-size:13px;box-shadow:0 4px 12px #0003}.btn:active{transform:scale(.97)}#joystick{position:absolute;left:24px;bottom:26px;width:122px;height:122px;border-radius:50%;background:#13251c75;border:2px solid #ffffff85;touch-action:none}#stick{position:absolute;left:35px;top:35px;width:48px;height:48px;border-radius:50%;background:#e8f3e6dd;border:2px solid #fff;box-shadow:0 3px 10px #0005}#actions{position:absolute;right:18px;bottom:25px;display:flex;gap:8px;align-items:end}.action{width:67px;height:67px;border-radius:50%;border:2px solid #ffffffaa;background:#9c4d29e8;color:white;font-weight:800;font-size:12px;box-shadow:0 4px 14px #0005}.action.small{width:55px;height:55px;background:#234f8ee8}.modal{display:none;position:absolute;inset:0;background:#06130dd9;align-items:center;justify-content:center;padding:18px}.card{width:min(440px,100%);background:#203c2d;border:1px solid #ffffff45;border-radius:20px;padding:20px;box-shadow:0 10px 40px #0007}.card h2{margin:0 0 8px}.card p{color:#d8e9dd;font-size:14px}.close{float:right}.choice{width:100%;text-align:left;margin:5px 0}.hint{position:absolute;bottom:164px;left:50%;transform:translateX(-50%);background:#11251fc9;border-radius:10px;padding:7px 10px;font-size:12px;white-space:nowrap;color:#fff;pointer-events:none}@media(min-width:800px){#joystick{left:34px;bottom:30px}.panel{width:260px}.hint{bottom:30px}}
</style></head><body><div id="game"><canvas id="world"></canvas>
<div class="top"><div class="pill">🐆 BABY LEOPARD · Lv. 1</div><div class="pill">🪙 <span id="coins">0</span> coins</div></div>
<div class="panel"><h3>🌿 First Steps</h3><div id="quest">Explore the forest</div><div class="bar"><span id="progress"></span></div><div id="progressText">0 / 100 steps</div><div style="margin-top:7px;color:#d9ebdb">XP: <b id="xp">0</b> · Health: ❤️ 100</div></div>
<div class="right"><button class="btn" onclick="openPanel('quests')">📜 Quests</button><button class="btn" onclick="openPanel('upgrade')">⬆️ Upgrade</button><button class="btn" onclick="openPanel('animals')">🐾 Animals</button><button class="btn" onclick="openPanel('settings')">⚙️ Graphics</button></div>
<div class="hint">Drag the joystick to explore · collect ✨ coins</div><div id="joystick"><div id="stick"></div></div><div id="actions"><button class="action small" onclick="howl()">HOWL</button><button class="action" onclick="pounce()">POUNCE</button></div>
<div class="modal" id="modal"><div class="card"><button class="btn close" onclick="closePanel()">✕</button><div id="modalContent"></div></div></div></div>
<script>
const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');let W=0,H=0,px=0,py=0,coins=0,xp=0,steps=0,level=1,speed=2.3,strength=1,joy={x:0,y:0},active=false,collectibles=[],trees=[];function resize(){W=canvas.width=innerWidth*devicePixelRatio;H=canvas.height=innerHeight*devicePixelRatio;ctx.setTransform(devicePixelRatio,0,0,devicePixelRatio,0,0);W=innerWidth;H=innerHeight;if(!px){px=W/2;py=H/2}seed()}function seed(){trees=[];collectibles=[];for(let i=0;i<70;i++)trees.push({x:Math.random()*W,y:Math.random()*H,r:12+Math.random()*22});for(let i=0;i<14;i++)collectibles.push({x:Math.random()*W,y:Math.random()*H,got:false})}function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#478653';ctx.fillRect(0,0,W,H);for(let i=0;i<90;i++){let x=(i*97+31)%W,y=(i*131+47)%H;ctx.strokeStyle=i%2?'#9cbd69':'#39774a';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x+4,y-7);ctx.stroke()}trees.forEach(t=>{ctx.fillStyle='#65462d';ctx.fillRect(t.x-4,t.y,8,14);ctx.fillStyle='#205c39';ctx.beginPath();ctx.arc(t.x,t.y,t.r,0,7);ctx.fill();ctx.fillStyle='#3e8048';ctx.beginPath();ctx.arc(t.x-5,t.y-5,t.r*.65,0,7);ctx.fill()});collectibles.forEach(c=>{if(!c.got){ctx.font='23px system-ui';ctx.fillText('✨',c.x,c.y)}});ctx.save();ctx.translate(px,py);ctx.font='43px system-ui';ctx.textAlign='center';ctx.fillText('🐆',0,12);ctx.restore();requestAnimationFrame(draw)}function tick(){if(joy.x||joy.y){px+=joy.x*speed;py+=joy.y*speed;px=Math.max(25,Math.min(W-25,px));py=Math.max(90,Math.min(H-35,py));steps+=Math.hypot(joy.x,joy.y);if(Math.random()<.025){xp++;document.getElementById('xp').textContent=xp}collectibles.forEach(c=>{if(!c.got&&Math.hypot(c.x-px,c.y-py)<35){c.got=true;coins+=5;document.getElementById('coins').textContent=coins;xp+=3;document.getElementById('xp').textContent=xp}});let n=Math.min(100,Math.floor(steps));document.getElementById('progress').style.width=n+'%';document.getElementById('progressText').textContent=n+' / 100 steps';if(steps>=100&&document.getElementById('quest').textContent==='Explore the forest'){coins+=25;xp+=20;document.getElementById('coins').textContent=coins;document.getElementById('xp').textContent=xp;document.getElementById('quest').textContent='Find glowing coins';document.getElementById('progressText').textContent='Quest complete! +25 coins'}}requestAnimationFrame(tick)}
const joyEl=document.getElementById('joystick'),stick=document.getElementById('stick');function setJoy(e){let r=joyEl.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=36,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}joy.x=dx/max;joy.y=dy/max;stick.style.left=(35+dx)+'px';stick.style.top=(35+dy)+'px'}joyEl.addEventListener('pointerdown',e=>{active=true;joyEl.setPointerCapture(e.pointerId);setJoy(e)});joyEl.addEventListener('pointermove',e=>{if(active)setJoy(e)});function release(){active=false;joy={x:0,y:0};stick.style.left='35px';stick.style.top='35px'}joyEl.addEventListener('pointerup',release);joyEl.addEventListener('pointercancel',release);
function pounce(){px+=joy.x*40;py+=joy.y*40;xp+=2;document.getElementById('xp').textContent=xp;toast('Pounce! +2 XP')}function howl(){toast('Your baby leopard lets out a tiny roar!')}function toast(s){document.querySelector('.hint').textContent=s;setTimeout(()=>document.querySelector('.hint').textContent='Drag the joystick to explore · collect ✨ coins',1700)}function openPanel(type){let html='';if(type==='quests')html='<h2>📜 Quests</h2><p>Explore the forest and collect glowing coins to earn XP and coins.</p><p>🌿 Explore 100 steps — reward: 25 coins + 20 XP</p><p>✨ Collect 5 coins — reward: 15 coins</p>';if(type==='upgrade')html='<h2>⬆️ Animal upgrades</h2><p>Coins: 🪙 '+coins+'</p><p>Strength level: '+strength+'</p><button class="btn choice" onclick="buyUpgrade()">Upgrade strength — 20 coins</button><button class="btn choice" onclick="buySpeed()">Upgrade speed — 20 coins</button><p>Upgrades are a starter-demo feature.</p>';if(type==='animals')html='<h2>🐾 Animal collection</h2><p>🐆 Baby Leopard — unlocked</p><p>🔒 Jaguar · 🦁 Lion · 🐅 Tiger · 🐘 Elephant · 🦒 Giraffe · 🐊 Crocodile</p><p>Earn coins and progress to unlock more animals in a future version.</p>';if(type==='settings')html='<h2>⚙️ Graphics</h2><p>Choose a visual quality setting:</p>'+['Low','Medium','High','Ultra'].map(v=>'<button class="btn choice" onclick="toast(\'Graphics preference: '+v+'\');closePanel()">'+v+'</button>').join('');document.getElementById('modalContent').innerHTML=html;document.getElementById('modal').style.display='flex'}function closePanel(){document.getElementById('modal').style.display='none'}function buyUpgrade(){if(coins>=20){coins-=20;strength++;document.getElementById('coins').textContent=coins;toast('Strength upgraded!')}else toast('Collect more coins first');openPanel('upgrade')}function buySpeed(){if(coins>=20){coins-=20;speed+=.4;document.getElementById('coins').textContent=coins;toast('Speed upgraded!')}else toast('Collect more coins first');openPanel('upgrade')}addEventListener('resize',resize);resize();draw();tick();
</script></body></html>
