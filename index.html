<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wild Animals Adventure</title>
<style>
*{box-sizing:border-box}body{margin:0;color:white;font-family:system-ui;background:url('menu-background.png') center/cover fixed;min-height:100vh}body:before{content:"";position:fixed;inset:0;background:linear-gradient(90deg,#06110bc9,#06110b30 55%,#06110b99),linear-gradient(0deg,#06110bcc,transparent 45%);z-index:-1}
.app{min-height:100vh;padding:20px;display:grid;grid-template-columns:220px 1fr 250px;grid-template-rows:auto 1fr auto;gap:16px}.brand{font-size:clamp(25px,3vw,44px);font-weight:1000;line-height:.9;text-shadow:0 3px 12px #000}.brand em{display:block;color:#ffc451;font-size:.7em;text-align:center}.profile,.wallet,.friends,.chat input{background:#071720c9;border:1px solid #ffffff55;backdrop-filter:blur(12px);border-radius:14px;padding:12px}.profile{grid-column:2;display:flex;gap:12px;align-items:center;justify-self:center;height:max-content}.wallet{grid-column:3;justify-self:end;height:max-content;white-space:nowrap}.nav{grid-row:2;align-self:center;display:grid;gap:8px}button{color:white;background:#071720d9;border:1px solid #ffffff55;border-radius:12px;padding:12px;cursor:pointer;font:inherit}button:hover,.active,.mode.selected{border-color:#ffd36a;box-shadow:0 0 16px #ffc45155}.nav button{text-align:left;font-size:18px;font-weight:700}.friends{grid-column:3;grid-row:2;align-self:center}.head,.friend{display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid #ffffff38;padding:10px 0}.head h2{margin:0}.face{font-size:26px}.online{color:#70f28b;font-size:12px}.bottom{grid-column:1/4;display:grid;grid-template-columns:220px 1fr auto;gap:12px;align-items:end}.chat input{color:white;width:100%;min-width:0}.modes{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.mode{min-width:90px;display:grid;gap:6px;text-align:center;font-size:13px}.mode span{font-size:27px}.start{background:linear-gradient(135deg,#ffe17c,#d88d15);color:#231700;font-size:20px;font-weight:900;padding:18px}.small{font-size:12px;color:#cad5d6}.bar{height:5px;background:#59676a;border-radius:8px;margin-top:6px}.bar:after{content:"";display:block;background:#ffc451;width:52%;height:100%;border-radius:8px}#notice{display:none;position:fixed;inset:35% auto auto 50%;transform:translateX(-50%);background:#06151bf2;border:1px solid #ffc451;border-radius:16px;padding:20px;max-width:85vw;text-align:center}#notice.show{display:block}
@media(max-width:750px){.app{padding:10px;grid-template-columns:1fr 1fr;grid-template-rows:auto 1fr auto}.brand{font-size:24px}.profile{grid-column:2;justify-self:end;font-size:12px}.wallet{display:none}.nav{grid-column:1;grid-row:2}.nav button{font-size:14px;padding:9px}.friends{grid-column:2;grid-row:2;padding:9px}.bottom{grid-column:1/3;grid-template-columns:1fr auto;gap:8px}.chat{display:none}.modes{grid-column:1;justify-content:start;gap:4px}.mode{min-width:65px;padding:6px;font-size:11px}.start{font-size:15px;padding:12px}}
</style></head><body><main class="app">
<div class="brand">WILD ANIMALS<em>ADVENTURE</em></div>
<div class="profile"><span style="font-size:34px">🐺</span><div><b>WolfPackLeader 👑</b><div class="small">Level 12 · Forest Guardian</div><div class="bar"></div><div class="small">520 / 1,000 XP</div></div></div>
<div class="wallet">🪙 2,450　💎 320　<button data-msg="Store preview">＋</button></div>
<nav class="nav"><button class="active" data-msg="Choose a mode, then tap Start Game.">🐾 Play　›</button><button data-msg="Friends menu preview. Real online friends require a server.">👥 Friends</button><button data-msg="Inventory preview — animal skins and accessories can be added later.">🎒 Inventory</button><button data-msg="Settings preview — graphics, sound and controls can be added later.">⚙️ Settings</button><button data-msg="Store preview — no purchases are connected.">🛒 Store</button><button data-msg="Close this browser tab to leave the game.">↪ Quit</button></nav>
<aside class="friends"><div class="head"><h2>Friends</h2><span>5/10 🟢</span></div>
<div class="friend"><span class="face">🐺</span><div style="flex:1">ShadowWolf<div class="online">● Online</div></div>›</div>
<div class="friend"><span class="face">🦊</span><div style="flex:1">Luna<div class="online">● Online</div></div>›</div>
<div class="friend"><span class="face">🐺</span><div style="flex:1">ForestGuard<div class="online">● Online</div></div>›</div>
<div class="friend"><span class="face">🦁</span><div style="flex:1">WildHunter<div style="color:#ffd05b;font-size:12px">● In Game</div></div>›</div>
<div class="friend"><span class="face">🦌</span><div style="flex:1">NatureQueen<div class="small">● Offline</div></div>›</div>
<button style="width:100%;margin-top:12px" data-msg="Add Friend is a demo. Player accounts are not connected yet.">♟ Add Friend</button></aside>
<footer class="bottom"><form class="chat" id="chat"><input id="msg" placeholder="💬 Chat with your friends…"></form><div class="modes"><button class="mode selected" data-mode="Free Roam"><span>🏔️</span>Free Roam</button><button class="mode " data-mode="Multiplayer"><span>🐺</span>Multiplayer</button><button class="mode " data-mode="Hunt"><span>🦌</span>Hunt</button><button class="mode " data-mode="Survival"><span>🐻</span>Survival</button><button class="mode " data-mode="Explore"><span>🌊</span>Explore</button></div><button class="start" id="start">🐾 Start Game</button></footer>
</main><div id="notice"><h2 id="nt"></h2><p id="np"></p><button onclick="document.getElementById('notice').classList.remove('show')">Okay</button></div>
<script>let mode='Free Roam';function pop(t,p){document.getElementById('nt').textContent=t;document.getElementById('np').textContent=p;document.getElementById('notice').classList.add('show')}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-mode]').forEach(x=>x.classList.remove('selected'));b.classList.add('selected');mode=b.dataset.mode});document.querySelectorAll('[data-msg]').forEach(b=>b.onclick=()=>pop(b.textContent.trim(),b.dataset.msg));document.getElementById('start').onclick=()=>pop(mode,mode==='Multiplayer'?'This is a menu prototype. Real multiplayer needs server-side accounts and networking.':'This upgraded menu is a visual prototype; the complete playable 3D world still needs to be built.');document.getElementById('chat').onsubmit=e=>{e.preventDefault();let v=document.getElementById('msg').value.trim();if(v)pop('Chat preview','Your message: '+v+' — not sent to other players.')};</script></body></html>
